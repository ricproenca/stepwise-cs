<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Open Sans', sans-serif; background: #fff; padding: 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .swatch { flex: 1; border-radius: 6px; height: 80px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; }
  .swatch-label { font-size: 11px; font-weight: 700; margin-bottom: 2px; }
  .swatch-hex { font-size: 10px; opacity: 0.75; font-family: monospace; }
  .light-text { color: #232830; }
  .dark-text { color: #fff; }
  .section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #546072; margin-bottom: 6px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="section-label">Cambridge Blue — Primary Palette</div>
  <div class="row">
    <div class="swatch light-text" style="background:#D1F9F1">
      <div class="swatch-label">Light Blue</div>
      <div class="swatch-hex">#D1F9F1</div>
    </div>
    <div class="swatch light-text" style="background:#8EE8D8">
      <div class="swatch-label">Cambridge Blue ★</div>
      <div class="swatch-hex">#8EE8D8</div>
    </div>
    <div class="swatch dark-text" style="background:#00BDB6">
      <div class="swatch-label">Warm Blue</div>
      <div class="swatch-hex">#00BDB6</div>
    </div>
    <div class="swatch dark-text" style="background:#133844">
      <div class="swatch-label">Dark Blue</div>
      <div class="swatch-hex">#133844</div>
    </div>
  </div>
</body>
</html>
