<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Open Sans', sans-serif; background: #fff; padding: 20px; }
  .palette { margin-bottom: 14px; }
  .palette-name { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #546072; margin-bottom: 5px; }
  .row { display: flex; gap: 6px; }
  .swatch { flex: 1; border-radius: 5px; height: 60px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; }
  .swatch-label { font-size: 10px; font-weight: 600; margin-bottom: 1px; }
  .swatch-hex { font-size: 9px; opacity: 0.7; font-family: monospace; }
  .lt { color: #232830; }
  .dk { color: #fff; }
</style>
</head>
<body>
  <div class="palette">
    <div class="palette-name">Crest — Warm Orange / Red</div>
    <div class="row">
      <div class="swatch lt" style="background:#FFE2C8"><div class="swatch-label">Light</div><div class="swatch-hex">#FFE2C8</div></div>
      <div class="swatch lt" style="background:#FFC392"><div class="swatch-label">Warm</div><div class="swatch-hex">#FFC392</div></div>
      <div class="swatch dk" style="background:#FD8153"><div class="swatch-label">Crest</div><div class="swatch-hex">#FD8153</div></div>
      <div class="swatch dk" style="background:#DD3025"><div class="swatch-label">Dark</div><div class="swatch-hex">#DD3025</div></div>
    </div>
  </div>
  <div class="palette">
    <div class="palette-name">Cherry — Rose / Magenta</div>
    <div class="row">
      <div class="swatch lt" style="background:#F2CAD8"><div class="swatch-label">Light</div><div class="swatch-hex">#F2CAD8</div></div>
      <div class="swatch lt" style="background:#E18AAC"><div class="swatch-label">Warm</div><div class="swatch-hex">#E18AAC</div></div>
      <div class="swatch dk" style="background:#CD3572"><div class="swatch-label">Cherry</div><div class="swatch-hex">#CD3572</div></div>
      <div class="swatch dk" style="background:#911449"><div class="swatch-label">Dark</div><div class="swatch-hex">#911449</div></div>
    </div>
  </div>
  <div class="palette">
    <div class="palette-name">Indigo</div>
    <div class="row">
      <div class="swatch lt" style="background:#EBEDFB"><div class="swatch-label">Light</div><div class="swatch-hex">#EBEDFB</div></div>
      <div class="swatch lt" style="background:#B0B9F1"><div class="swatch-label">Warm</div><div class="swatch-hex">#B0B9F1</div></div>
      <div class="swatch dk" style="background:#5366E0"><div class="swatch-label">Indigo</div><div class="swatch-hex">#5366E0</div></div>
      <div class="swatch dk" style="background:#29347A"><div class="swatch-label">Dark</div><div class="swatch-hex">#29347A</div></div>
    </div>
  </div>
  <div class="palette">
    <div class="palette-name">Green</div>
    <div class="row">
      <div class="swatch lt" style="background:#DFF2EA"><div class="swatch-label">Light</div><div class="swatch-hex">#DFF2EA</div></div>
      <div class="swatch lt" style="background:#AFDFCB"><div class="swatch-label">Warm</div><div class="swatch-hex">#AFDFCB</div></div>
      <div class="swatch dk" style="background:#4DB78C"><div class="swatch-label">Green</div><div class="swatch-hex">#4DB78C</div></div>
      <div class="swatch dk" style="background:#13553A"><div class="swatch-label">Dark</div><div class="swatch-hex">#13553A</div></div>
    </div>
  </div>
</body>
</html>
