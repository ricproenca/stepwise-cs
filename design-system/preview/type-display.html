<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Open Sans', sans-serif; background: #fff; padding: 24px 28px; color: #232830; }
  .specimen { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #ECEEF1; }
  .specimen:last-child { border-bottom: none; margin-bottom: 0; }
  .meta { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #B5BDC8; margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="specimen">
    <div class="meta">Display XL — Playfair Display 72px Bold</div>
    <div style="font-family:'Playfair Display',serif;font-size:52px;font-weight:700;line-height:1.15;letter-spacing:-0.02em;">Inspiring curiosity</div>
  </div>
  <div class="specimen">
    <div class="meta">H1 — Playfair Display 48px Bold</div>
    <div style="font-family:'Playfair Display',serif;font-size:36px;font-weight:700;line-height:1.2;">Cambridge AS & A Level</div>
  </div>
  <div class="specimen">
    <div class="meta">H2 — Playfair Display 36px Semibold</div>
    <div style="font-family:'Playfair Display',serif;font-size:28px;font-weight:600;line-height:1.3;">Recognised worldwide</div>
  </div>
  <div class="specimen">
    <div class="meta">Pull Quote — Playfair Display 30px Italic</div>
    <div style="font-family:'Playfair Display',serif;font-style:italic;font-size:22px;font-weight:400;line-height:1.4;color:#133844;">"Fostering informed curiosity and a lasting passion for learning."</div>
  </div>
</body>
</html>
