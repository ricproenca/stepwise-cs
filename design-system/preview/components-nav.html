<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Open Sans', sans-serif; background: #fff; }
  nav { background: #133844; padding: 0 32px; display: flex; align-items: center; height: 60px; gap: 0; }
  .logo { display: flex; align-items: center; gap: 10px; margin-right: 36px; }
  .logo-shield { width: 28px; height: 32px; }
  .logo-text { display: flex; flex-direction: column; }
  .logo-main { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.1; }
  .logo-sub { font-size: 10px; color: #8EE8D8; font-weight: 400; line-height: 1.2; }
  .nav-links { display: flex; gap: 0; flex: 1; }
  .nav-link { padding: 0 16px; height: 60px; display: flex; align-items: center; font-size: 13px; font-weight: 600; color: #D1F9F1; text-decoration: none; border-bottom: 3px solid transparent; transition: all 150ms; }
  .nav-link:hover, .nav-link.active { color: #fff; border-bottom-color: #8EE8D8; }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .nav-search { background: none; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; padding: 6px 12px; color: #fff; font-size: 12px; font-family: 'Open Sans', sans-serif; outline: none; }
  .nav-cta { background: #8EE8D8; color: #133844; padding: 7px 16px; border-radius: 4px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; font-family: 'Open Sans', sans-serif; }
  /* Secondary nav */
  .subnav { background: #fff; border-bottom: 2px solid #ECEEF1; padding: 0 32px; display: flex; gap: 0; }
  .subnav-link { padding: 12px 16px; font-size: 13px; color: #546072; font-weight: 600; text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .subnav-link.active { color: #133844; border-bottom-color: #00BDB6; }
  .subnav-link:hover { color: #133844; }
</style>
</head>
<body>
  <nav>
    <div class="logo">
      <svg class="logo-shield" viewBox="0 0 28 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 1L2 6v12c0 8 5.5 13.5 12 15 6.5-1.5 12-7 12-15V6L14 1z" fill="#8EE8D8" stroke="#8EE8D8" stroke-width="0.5"/>
        <path d="M14 5L5 9v9c0 5.5 3.8 9.5 9 11 5.2-1.5 9-5.5 9-11V9L14 5z" fill="#133844"/>
        <text x="14" y="22" text-anchor="middle" font-size="9" fill="#8EE8D8" font-family="serif" font-weight="bold">✦</text>
      </svg>
      <div class="logo-text">
        <span class="logo-main">Cambridge</span>
        <span class="logo-sub">International Education</span>
      </div>
    </div>
    <div class="nav-links">
      <a class="nav-link active" href="#">Programmes</a>
      <a class="nav-link" href="#">Qualifications</a>
      <a class="nav-link" href="#">Schools</a>
      <a class="nav-link" href="#">Teachers</a>
      <a class="nav-link" href="#">Students</a>
    </div>
    <div class="nav-right">
      <input class="nav-search" placeholder="Search…" type="text">
      <button class="nav-cta">Sign in</button>
    </div>
  </nav>
  <div class="subnav">
    <a class="subnav-link active" href="#">Overview</a>
    <a class="subnav-link" href="#">Syllabuses</a>
    <a class="subnav-link" href="#">Past papers</a>
    <a class="subnav-link" href="#">Teacher resources</a>
    <a class="subnav-link" href="#">Results</a>
  </div>
</body>
</html>
