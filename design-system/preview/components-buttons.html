<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Open Sans', sans-serif; background: #fff; padding: 20px 24px; }
  .section { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #B5BDC8; margin-bottom: 10px; margin-top: 16px; }
  .section:first-child { margin-top: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  /* Primary buttons */
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 4px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; font-family: 'Open Sans', sans-serif; text-decoration: none; }
  .btn-primary { background: #133844; color: #fff; }
  .btn-primary:hover { background: #1a4d5c; }
  .btn-secondary { background: #00BDB6; color: #fff; }
  .btn-secondary:hover { background: #00a09a; }
  .btn-ghost { background: transparent; color: #133844; border: 2px solid #133844; }
  .btn-ghost:hover { background: #133844; color: #fff; }
  .btn-teal { background: #8EE8D8; color: #133844; }
  .btn-disabled { background: #ECEEF1; color: #B5BDC8; cursor: not-allowed; }
  .btn-sm { padding: 7px 14px; font-size: 13px; }
  .btn-lg { padding: 14px 28px; font-size: 16px; }
  .btn-icon { padding: 10px 16px; }
  .arrow { font-size: 16px; line-height: 1; }
</style>
</head>
<body>
  <div class="section">Primary Buttons</div>
  <div class="row">
    <button class="btn btn-primary">Find out more <span class="arrow">→</span></button>
    <button class="btn btn-secondary">Explore subjects</button>
    <button class="btn btn-ghost">Download syllabus</button>
    <button class="btn btn-teal">Register interest</button>
  </div>

  <div class="section">Sizes</div>
  <div class="row">
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary btn-lg">Large</button>
    <button class="btn btn-primary btn-disabled" disabled>Disabled</button>
  </div>

  <div class="section">On Dark Background</div>
  <div class="row" style="background:#133844;padding:14px;border-radius:6px">
    <button class="btn" style="background:#8EE8D8;color:#133844;border-radius:4px;font-family:'Open Sans',sans-serif;font-weight:700;font-size:14px;padding:10px 20px;border:none;cursor:pointer;">Find out more</button>
    <button class="btn" style="background:transparent;color:#D1F9F1;border:2px solid #8EE8D8;border-radius:4px;font-family:'Open Sans',sans-serif;font-weight:700;font-size:14px;padding:10px 20px;cursor:pointer;">View syllabus</button>
    <button class="btn" style="background:#00BDB6;color:#fff;border-radius:4px;font-family:'Open Sans',sans-serif;font-weight:700;font-size:14px;padding:10px 20px;border:none;cursor:pointer;">Register</button>
  </div>
</body>
</html>
