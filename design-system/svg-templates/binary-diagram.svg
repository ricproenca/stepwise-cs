<svg viewBox="0 0 480 120" role="img" xmlns="http://www.w3.org/2000/svg"
     style="font-family:'Courier New',monospace; width:100%; max-width:600px;">
  <title>Binary diagram template</title>
  <desc>8-bit binary column weighting diagram. Each cell shows a bit value (0 or 1) with its column weight below. Adapt the bit values and column weights to the specific example.</desc>

  <!-- Column weights (top labels) -->
  <text x="30"  y="16" text-anchor="middle" font-size="12" fill="#546072" font-family="'Open Sans',sans-serif">2⁷</text>
  <text x="90"  y="16" text-anchor="middle" font-size="12" fill="#546072" font-family="'Open Sans',sans-serif">2⁶</text>
  <text x="150" y="16" text-anchor="middle" font-size="12" fill="#546072" font-family="'Open Sans',sans-serif">2⁵</text>
  <text x="210" y="16" text-anchor="middle" font-size="12" fill="#546072" font-family="'Open Sans',sans-serif">2⁴</text>
  <text x="270" y="16" text-anchor="middle" font-size="12" fill="#546072" font-family="'Open Sans',sans-serif">2³</text>
  <text x="330" y="16" text-anchor="middle" font-size="12" fill="#546072" font-family="'Open Sans',sans-serif">2²</text>
  <text x="390" y="16" text-anchor="middle" font-size="12" fill="#546072" font-family="'Open Sans',sans-serif">2¹</text>
  <text x="450" y="16" text-anchor="middle" font-size="12" fill="#546072" font-family="'Open Sans',sans-serif">2⁰</text>

  <!-- Bit cells (8 × 48px wide, 48px tall, starting y=22) -->
  <!-- Cell 7 (MSB) — bit = 0 -->
  <rect x="6"   y="22" width="48" height="48" rx="4" fill="#ECEEF1" stroke="#B5BDC8" stroke-width="1.5"/>
  <text x="30"  y="52" text-anchor="middle" font-size="22" fill="#133844" font-weight="700">0</text>

  <!-- Cell 6 — bit = 1 (highlighted) -->
  <rect x="66"  y="22" width="48" height="48" rx="4" fill="#D1F9F1" stroke="#133844" stroke-width="2"/>
  <text x="90"  y="52" text-anchor="middle" font-size="22" fill="#133844" font-weight="700">1</text>

  <!-- Cell 5 — bit = 1 -->
  <rect x="126" y="22" width="48" height="48" rx="4" fill="#D1F9F1" stroke="#133844" stroke-width="2"/>
  <text x="150" y="52" text-anchor="middle" font-size="22" fill="#133844" font-weight="700">1</text>

  <!-- Cell 4 — bit = 0 -->
  <rect x="186" y="22" width="48" height="48" rx="4" fill="#ECEEF1" stroke="#B5BDC8" stroke-width="1.5"/>
  <text x="210" y="52" text-anchor="middle" font-size="22" fill="#133844" font-weight="700">0</text>

  <!-- Cell 3 — bit = 1 -->
  <rect x="246" y="22" width="48" height="48" rx="4" fill="#D1F9F1" stroke="#133844" stroke-width="2"/>
  <text x="270" y="52" text-anchor="middle" font-size="22" fill="#133844" font-weight="700">1</text>

  <!-- Cell 2 — bit = 0 -->
  <rect x="306" y="22" width="48" height="48" rx="4" fill="#ECEEF1" stroke="#B5BDC8" stroke-width="1.5"/>
  <text x="330" y="52" text-anchor="middle" font-size="22" fill="#133844" font-weight="700">0</text>

  <!-- Cell 1 — bit = 0 -->
  <rect x="366" y="22" width="48" height="48" rx="4" fill="#ECEEF1" stroke="#B5BDC8" stroke-width="1.5"/>
  <text x="390" y="52" text-anchor="middle" font-size="22" fill="#133844" font-weight="700">0</text>

  <!-- Cell 0 (LSB) — bit = 1 -->
  <rect x="426" y="22" width="48" height="48" rx="4" fill="#D1F9F1" stroke="#133844" stroke-width="2"/>
  <text x="450" y="52" text-anchor="middle" font-size="22" fill="#133844" font-weight="700">1</text>

  <!-- Column weight values (bottom labels) -->
  <text x="30"  y="86" text-anchor="middle" font-size="11" fill="#133844" font-family="'Open Sans',sans-serif" font-weight="600">128</text>
  <text x="90"  y="86" text-anchor="middle" font-size="11" fill="#133844" font-family="'Open Sans',sans-serif" font-weight="600">64</text>
  <text x="150" y="86" text-anchor="middle" font-size="11" fill="#133844" font-family="'Open Sans',sans-serif" font-weight="600">32</text>
  <text x="210" y="86" text-anchor="middle" font-size="11" fill="#133844" font-family="'Open Sans',sans-serif" font-weight="600">16</text>
  <text x="270" y="86" text-anchor="middle" font-size="11" fill="#133844" font-family="'Open Sans',sans-serif" font-weight="600">8</text>
  <text x="330" y="86" text-anchor="middle" font-size="11" fill="#133844" font-family="'Open Sans',sans-serif" font-weight="600">4</text>
  <text x="390" y="86" text-anchor="middle" font-size="11" fill="#133844" font-family="'Open Sans',sans-serif" font-weight="600">2</text>
  <text x="450" y="86" text-anchor="middle" font-size="11" fill="#133844" font-family="'Open Sans',sans-serif" font-weight="600">1</text>

  <!-- Result annotation -->
  <text x="240" y="110" text-anchor="middle" font-size="12" fill="#546072" font-family="'Open Sans',sans-serif">64 + 32 + 8 + 1 = 105</text>
</svg>
