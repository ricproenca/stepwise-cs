<svg viewBox="0 0 320 300" role="img" xmlns="http://www.w3.org/2000/svg"
     style="font-family:'Open Sans',sans-serif; width:100%; max-width:480px;">
  <title>Flowchart template</title>
  <desc>Flowchart with two process boxes, one decision diamond, and connecting arrows. Adapt labels and add/remove steps as needed.</desc>

  <!-- Process box 1 -->
  <rect x="80" y="16" width="160" height="48" rx="4"
        fill="#D1F9F1" stroke="#133844" stroke-width="2"/>
  <text x="160" y="45" text-anchor="middle" font-size="13"
        fill="#133844" font-weight="600">Step 1 label</text>

  <!-- Arrow: box 1 → diamond -->
  <line x1="160" y1="64" x2="160" y2="96" stroke="#133844" stroke-width="2"/>
  <polygon points="154,94 166,94 160,106" fill="#133844"/>

  <!-- Decision diamond -->
  <polygon points="160,108 248,152 160,196 72,152"
           fill="#D1F9F1" stroke="#133844" stroke-width="2"/>
  <text x="160" y="157" text-anchor="middle" font-size="12"
        fill="#133844" font-weight="600">Condition?</text>

  <!-- Yes label (down) -->
  <text x="168" y="212" font-size="11" fill="#133844">Yes</text>
  <!-- No label (right) -->
  <text x="252" y="157" font-size="11" fill="#133844">No</text>

  <!-- Arrow: diamond → box 2 (Yes path) -->
  <line x1="160" y1="196" x2="160" y2="228" stroke="#133844" stroke-width="2"/>
  <polygon points="154,226 166,226 160,238" fill="#133844"/>

  <!-- Process box 2 (Yes result) -->
  <rect x="80" y="240" width="160" height="48" rx="4"
        fill="#D1F9F1" stroke="#133844" stroke-width="2"/>
  <text x="160" y="269" text-anchor="middle" font-size="13"
        fill="#133844" font-weight="600">Step 2 label</text>

  <!-- Arrow: diamond → right (No path) — extend rightward -->
  <polyline points="248,152 290,152 290,264 240,264"
            fill="none" stroke="#133844" stroke-width="2"/>
  <polygon points="238,258 238,270 250,264" fill="#133844"/>
  <text x="292" y="210" font-size="11" fill="#133844">Alternative</text>
</svg>
