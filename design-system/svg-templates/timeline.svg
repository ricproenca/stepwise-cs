<svg viewBox="0 0 480 120" role="img" xmlns="http://www.w3.org/2000/svg"
     style="font-family:'Open Sans',sans-serif; width:100%; max-width:600px;">
  <title>Timeline template</title>
  <desc>Horizontal timeline with 4 nodes connected by arrows. Adapt node labels and descriptions to the specific sequence.</desc>

  <!-- Horizontal axis line -->
  <line x1="40" y1="56" x2="440" y2="56" stroke="#133844" stroke-width="2"/>

  <!-- Arrow at end of axis -->
  <polygon points="440,50 452,56 440,62" fill="#133844"/>

  <!-- Node positions: 60, 180, 300, 420 -->

  <!-- Node 1 -->
  <circle cx="60"  cy="56" r="14" fill="#133844" stroke="#133844" stroke-width="2"/>
  <text x="60"  y="61" text-anchor="middle" font-size="11" fill="#D1F9F1" font-weight="700">1</text>
  <text x="60"  y="86" text-anchor="middle" font-size="11" fill="#133844" font-weight="600">Step 1</text>
  <text x="60"  y="100" text-anchor="middle" font-size="10" fill="#546072">Description</text>

  <!-- Node 2 -->
  <circle cx="180" cy="56" r="14" fill="#D1F9F1" stroke="#133844" stroke-width="2"/>
  <text x="180" y="61" text-anchor="middle" font-size="11" fill="#133844" font-weight="700">2</text>
  <text x="180" y="86" text-anchor="middle" font-size="11" fill="#133844" font-weight="600">Step 2</text>
  <text x="180" y="100" text-anchor="middle" font-size="10" fill="#546072">Description</text>

  <!-- Node 3 -->
  <circle cx="300" cy="56" r="14" fill="#D1F9F1" stroke="#133844" stroke-width="2"/>
  <text x="300" y="61" text-anchor="middle" font-size="11" fill="#133844" font-weight="700">3</text>
  <text x="300" y="86" text-anchor="middle" font-size="11" fill="#133844" font-weight="600">Step 3</text>
  <text x="300" y="100" text-anchor="middle" font-size="10" fill="#546072">Description</text>

  <!-- Node 4 -->
  <circle cx="420" cy="56" r="14" fill="#133844" stroke="#133844" stroke-width="2"/>
  <text x="420" y="61" text-anchor="middle" font-size="11" fill="#D1F9F1" font-weight="700">4</text>
  <text x="420" y="86" text-anchor="middle" font-size="11" fill="#133844" font-weight="600">Step 4</text>
  <text x="420" y="100" text-anchor="middle" font-size="10" fill="#546072">Description</text>

  <!-- Title label -->
  <text x="240" y="20" text-anchor="middle" font-size="13"
        fill="#133844" font-weight="700">Timeline title</text>
</svg>
